<title>On se prépare..</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='83'%3E%F0%9F%90%88%3C/text%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--purple:#ab65f5;--lilac:#d8b7ff;--muted:#aca2b8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#08050d;color:#f8f5fc}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.page{position:relative;isolation:isolate;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:42px 20px 30px;text-align:center}
.page:before{content:"";position:absolute;z-index:-3;inset:0;background:radial-gradient(ellipse 48% 32% at 50% 26%,#4a1b703d,transparent 80%),radial-gradient(ellipse 45% 25% at 90% 90%,#2a104733,transparent 80%),#08050d}
.ambient{position:absolute;z-index:-2;width:min(700px,95vw);height:min(700px,95vw);left:50%;top:0;transform:translate(-50%,-35%);border-radius:50%;border:1px solid #8c42dd24;box-shadow:0 0 120px #7b2eb222;pointer-events:none}
.content{width:min(100%,720px);display:flex;flex-direction:column;align-items:center}
.logo{width:clamp(155px,25vw,230px);height:auto;filter:drop-shadow(0 0 34px #8e3cda44);animation:float 7s ease-in-out infinite;user-select:none}
.eyebrow{margin:17px 0 9px;font-size:11px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--lilac)}
h1{font-size:clamp(29px,5.3vw,52px);letter-spacing:-.045em;font-weight:780;line-height:1.08;margin:0}
.subtitle{margin:17px 0 30px;font-size:clamp(12px,2vw,15px);color:var(--muted);line-height:1.6}
.countdown{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(7px,1.8vw,14px);width:min(100%,580px)}
.unit{padding:clamp(15px,3vw,25px) 7px clamp(13px,2.5vw,19px);background:linear-gradient(145deg,#21122e99,#100b16d9);border:1px solid #b887ef31;border-radius:16px;box-shadow:inset 0 1px #ffffff0c,0 12px 35px #0005}
.value{font-variant-numeric:tabular-nums;letter-spacing:-.055em;font-weight:780;font-size:clamp(31px,7.3vw,63px);line-height:1.06}
.unit-label{margin-top:11px;font-size:clamp(9px,1.7vw,11px);text-transform:uppercase;letter-spacing:clamp(.06em,.22vw,.18em);color:#b8abc7}
.reopening{margin-top:19px;color:#8f819b;font-size:12px}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:12px;margin-top:28px;padding:13px 22px;border-radius:999px;background:#f6edff;color:#130a1b;text-decoration:none;font-size:12px;font-weight:800;letter-spacing:.055em;transition:transform .2s,background .2s}
.cta:hover{transform:translateY(-2px);background:#dfc5ff}
.cta[hidden]{display:none}
footer{display:flex;flex-direction:column;align-items:center;gap:13px;margin-top:50px}
.socials{display:flex;gap:11px}
.social{width:44px;height:44px;display:grid;place-items:center;border:1px solid #ffffff2d;border-radius:50%;color:#f5ecfb;background:#ffffff08;transition:transform .2s,border-color .2s,background .2s}
.social:hover{transform:translateY(-2px);border-color:#bc84fb;background:#b96ff522}
.social svg{width:20px;height:20px}
.copyright{color:#726a79;font-size:10px;letter-spacing:.12em}
@keyframes float{50%{transform:translateY(-7px)}}
@media(prefers-reduced-motion:reduce){.logo{animation:none}.cta,.social{transition:none}}
@media(max-width:400px){.page{padding:25px 15px 24px}.logo{width:162px}.subtitle{margin-bottom:24px}.unit{border-radius:12px}.unit-label{letter-spacing:.02em}footer{margin-top:35px}}
</style>
</head>

<script>
(() => {
  "use strict";
  const REOPEN_AT = Date.parse("2026-11-30T08:00:00+01:00");
  const SITE_URL = "https://bde-blackout.com/";
  const ids = ["days","hours","minutes","seconds"];
  const elements = ids.map(id => document.getElementById(id));
  const link = document.getElementById("site-link");
  let finished = false;
  function update() {
    const remaining = Math.max(0,Math.ceil((REOPEN_AT-Date.now())/1000));
    const numbers = [
      Math.floor(remaining/86400),
      Math.floor(remaining%86400/3600),
      Math.floor(remaining%3600/60),
      remaining%60
    ];
    numbers.forEach((number,index) => {
      elements[index].textContent = String(number).padStart(2,"0");
    });
    if (remaining === 0 && !finished) {
      finished = true;
      document.getElementById("headline").textContent = "BLACKOUT est de retour.";
      document.getElementById("subtitle").textContent = "C'est le moment de nous retrouver.";
      document.getElementById("status").textContent = "Le compte à rebours est terminé.";
      link.hidden = false;
      if (location.hostname !== new URL(SITE_URL).hostname && location.protocol !== "file:") {
        location.replace(SITE_URL);
      }
    }
  }
  update();
  const interval = setInterval(() => {
    update();
    if (finished) clearInterval(interval);
  },250);
})();
</script>
